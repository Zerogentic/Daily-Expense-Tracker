name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates the standard platform files. Files already in the repo
      # (AndroidManifest.xml, lib/) are kept as they are.
      - name: Generate Android platform files
        run: flutter create --org com.zerogentic --project-name expensetracker --platforms android .

      # A fixed test key, so each new build installs over the previous one.
      # Store releases will be signed with a private upload key instead.
      - name: Use the shared test signing key
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk daily-expense-tracker-${{ github.run_number }}.apk

      - name: Publish as a test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          prerelease: true
          files: daily-expense-tracker-${{ github.run_number }}.apk
          body: |
            Test build for your own Android phone (no SMS access, so Play Protect won't block it).
            Built from commit ${{ github.sha }}.

  ios:
    name: iOS build check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform files
        run: flutter create --org com.zerogentic --project-name expensetracker --platforms ios .

      - run: flutter pub get

      # Proves the app compiles for iPhone. Signing for TestFlight and the
      # App Store needs an Apple Developer account and is added later.
      - name: Build for iOS (unsigned)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
